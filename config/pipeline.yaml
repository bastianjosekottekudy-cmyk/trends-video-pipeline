top_trends: 20
max_news_per_trend: 2
max_images_per_trend: 5
max_video_duration_sec: 570   # 9m30s hard cap

web:
  host: 127.0.0.1
  port: 8080

video:
  width: 1920
  height: 1080
  target_duration_sec: 180
  fps: 24
  format: mp4
  # auto = use NVIDIA NVENC when available, else libx264
  codec: auto

tts:
  provider: edge-tts
  rate: "-12%"
  segment_pause_sec: 0.55
  voice_map:
    en: en-US-JennyNeural

script:
  provider: groq   # groq | template
  model: llama-3.1-8b-instant
  style: warm, conversational spoken host; natural pacing; complete sentences; no headline-reading; no invented facts
  intro_template: "Here are today's top trending searches in {country}."
  outro_template: "Thanks for watching. Subscribe for daily trends updates."

images:
  providers: [wikimedia, openverse, news_og]

# Automatic upload is future scope — videos are stored locally for manual upload.
youtube:
  enabled: false
  category_id: "25"
  privacy: public
  made_for_kids: false
